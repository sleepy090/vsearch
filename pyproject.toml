[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsearch"
version = "0.1.0"
description = "Поиск и просмотр фильмов на Rutube из терминала"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
banner = ["pyfiglet>=1.0"]

[project.scripts]
vsearch = "vsearch.cli:main"

[tool.setuptools]
packages = ["vsearch"]
include-package-data = true

[tool.setuptools.package-data]
vsearch = ["data/*.yaml"]