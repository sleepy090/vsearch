name: windows build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          
pip install pyinstaller yt-dlp requests

      - name: build exe
        run: |
          pyinstaller --onefile --name vsearch vsearch.py

      - name: upload exe
        uses: actions/upload-artifact@v4
        with:
          name: vsearch-windows
          path: dist/vsearch.exe
